name: Build Windows Release

# 在 GitHub 云端 Windows runner 上打包 OC Ferry（含"写入 WorkBuddy AI"多目标补丁）。
# 云端 runner 直连 github.com，可正常下载 Electron 与 NSIS 资源，无需任何代理。
# 产物为未签名的 NSIS 安装包（带开机自启），用户下载后点"仍要运行"即可。
on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OC-Ferry-Windows
          path: release/*.exe
          retention-days: 30
